# Castalia Azul — deeper marine blue (Bible §8.2).
# "Blue like the old days" with an original palette; deliberately NOT Luna blue.

[meta]
name = "Castalia Azul"
id = "azul"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#2F6FB2"              # saturated marine blue
titlebar_top = "#2F6FB2"
titlebar_bottom = "#1F5590"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#7D8A94"
titlebar_inactive_bottom = "#66727C"
titlebar_inactive_text = "#FFFFFF"
surface = "#E8EBEF"             # cool light grey
surface_alt = "#DCE1E8"
text = "#1A2027"
text_secondary = "#4E5A68"
selection_bg = "#1F5590"
selection_text = "#FFFFFF"
border = "#AAB4C0"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 2
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"

[assets]
# Per-theme desktop wallpaper (repo-relative); see themes/SCHEMA.md.
wallpaper = "branding/wallpapers/marine-deep.svg"
