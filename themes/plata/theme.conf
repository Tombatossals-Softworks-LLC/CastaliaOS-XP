# Castalia Plata — silver/graphite, low-chroma, understated pro (Bible §8.2).

[meta]
name = "Castalia Plata"
id = "plata"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#56718C"              # steel blue-grey
titlebar_top = "#5A626C"        # graphite, dark enough for white text
titlebar_bottom = "#454C55"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#7D8A94"
titlebar_inactive_bottom = "#66727C"
titlebar_inactive_text = "#FFFFFF"
surface = "#E9EAEC"             # light silver
surface_alt = "#DEE0E3"
text = "#22252A"
text_secondary = "#555B63"
selection_bg = "#56718C"
selection_text = "#FFFFFF"
border = "#B4B8BE"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 2
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"

[assets]
# Per-theme desktop wallpaper (repo-relative); see themes/SCHEMA.md.
wallpaper = "branding/wallpapers/silver-morning.svg"
