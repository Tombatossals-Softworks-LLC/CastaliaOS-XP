# Castalia Medianoche — a comfortable dark theme (Bible §8.2).
# Graphite surfaces and a sky-blue accent: a real dark mode for the whole
# desktop, not a wash of pure black. Every contrast pair meets WCAG AA and the
# titlebar gradient stays band-free on 16-bit display modes (theme-lint §8).

[meta]
name = "Castalia Medianoche"
id = "medianoche"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#4C9BE0"                    # sky-blue accent for a dark UI
titlebar_top = "#39414E"              # dark slate gradient (delta 0.028)
titlebar_bottom = "#262B33"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#2E333A"
titlebar_inactive_bottom = "#262A30"
titlebar_inactive_text = "#B8BFC8"
surface = "#23272E"                   # graphite
surface_alt = "#2B3038"
text = "#EAEDF1"                      # near-white body text
text_secondary = "#A9B2BD"
selection_bg = "#2F6FB2"              # deep-blue selection, white text
selection_text = "#FFFFFF"
border = "#3A414B"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 2
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"

[assets]
# Per-theme desktop wallpaper (repo-relative); see themes/SCHEMA.md.
wallpaper = "branding/wallpapers/midnight-keep.svg"
