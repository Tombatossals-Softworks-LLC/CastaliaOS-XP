<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: calculator — aluminium body, warm display, sun-orange
       equals key (§8.4). Original artwork, Tombatossals Softworks.
       Light source: top-left. -->
  <defs>
    <linearGradient id="clc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEEEEC"/>
      <stop offset="1" stop-color="#D3D7CF"/>
    </linearGradient>
    <linearGradient id="clc-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="43" rx="14" ry="2" fill="#2E3436" opacity="0.12"/>
  <rect x="10" y="6" width="28" height="36" rx="3"
        fill="url(#clc-body)" stroke="#888A85" stroke-width="1"/>
  <rect x="14" y="10" width="20" height="8" rx="1"
        fill="#FFF3DF" stroke="#C17D11" stroke-width="1"/>
  <rect x="26" y="12" width="6" height="4" fill="#E9B96E" opacity="0.8"/>
  <g fill="#FFFFFF" stroke="#888A85" stroke-width="1">
    <rect x="14" y="22" width="5" height="5" rx="1"/>
    <rect x="21.5" y="22" width="5" height="5" rx="1"/>
    <rect x="29" y="22" width="5" height="5" rx="1"/>
    <rect x="14" y="29.5" width="5" height="5" rx="1"/>
    <rect x="21.5" y="29.5" width="5" height="5" rx="1"/>
  </g>
  <rect x="29" y="29.5" width="5" height="8.5" rx="1"
        fill="url(#clc-key)" stroke="#CE5C00" stroke-width="1"/>
  <rect x="14" y="36.5" width="12.5" height="3.5" rx="1"
        fill="#FFFFFF" stroke="#888A85" stroke-width="1"/>
</svg>
