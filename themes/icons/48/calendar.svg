<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: calendar (Calendario) — paper pad with a chocolate
       header, sun-orange binding rings and a marked day (§8.4). Original
       artwork, Tombatossals Softworks. Light source: top-left. -->
  <defs>
    <linearGradient id="cal-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A473B"/>
      <stop offset="1" stop-color="#3E3028"/>
    </linearGradient>
    <linearGradient id="cal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEC"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="43" rx="15" ry="2" fill="#2E3436" opacity="0.12"/>
  <rect x="8" y="10" width="32" height="30" rx="3"
        fill="url(#cal-body)" stroke="#888A85" stroke-width="1"/>
  <path d="M 8 13 a 3 3 0 0 1 3 -3 h 26 a 3 3 0 0 1 3 3 v 6 H 8 Z"
        fill="url(#cal-head)" stroke="#2E3436" stroke-width="1"/>
  <!-- binding rings -->
  <g stroke="#CE5C00" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="7" x2="16" y2="13"/>
    <line x1="32" y1="7" x2="32" y2="13"/>
  </g>
  <circle cx="16" cy="7" r="1.6" fill="#FCAF3E"/>
  <circle cx="32" cy="7" r="1.6" fill="#FCAF3E"/>
  <!-- day grid -->
  <g fill="#BABDB6">
    <rect x="12" y="23" width="4" height="4" rx="1"/>
    <rect x="18.5" y="23" width="4" height="4" rx="1"/>
    <rect x="25" y="23" width="4" height="4" rx="1"/>
    <rect x="31.5" y="23" width="4" height="4" rx="1"/>
    <rect x="12" y="29" width="4" height="4" rx="1"/>
    <rect x="25" y="29" width="4" height="4" rx="1"/>
    <rect x="31.5" y="29" width="4" height="4" rx="1"/>
    <rect x="12" y="35" width="4" height="4" rx="1"/>
    <rect x="18.5" y="35" width="4" height="4" rx="1"/>
    <rect x="25" y="35" width="4" height="4" rx="1"/>
  </g>
  <!-- the marked (selected) day, in sun orange -->
  <rect x="18.5" y="29" width="4" height="4" rx="1"
        fill="#F57900" stroke="#CE5C00" stroke-width="0.8"/>
</svg>
