<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: cards (Solitario) — white card over a sun-orange
       card back (§8.4). Pips are paths, not fonts. Original artwork,
       Tombatossals Softworks. Light source: top-left. -->
  <defs>
    <linearGradient id="crd-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
    <linearGradient id="crd-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEC"/>
    </linearGradient>
  </defs>
  <ellipse cx="25" cy="43" rx="15" ry="2" fill="#2E3436" opacity="0.14"/>
  <g transform="rotate(12 32 22)">
    <rect x="24" y="6" width="18" height="26" rx="2"
          fill="#FFFFFF" stroke="#888A85" stroke-width="1"/>
    <rect x="26" y="8" width="14" height="22" rx="1"
          fill="url(#crd-back)" stroke="#CE5C00" stroke-width="0.8"/>
    <path d="M 27 12 l 12 8 m -12 -2 l 12 8 m -12 -14 l 12 8"
          stroke="#FFE0B0" stroke-width="1.2" opacity="0.8" fill="none"/>
  </g>
  <g transform="rotate(-8 16 26)">
    <rect x="7" y="12" width="18" height="26" rx="2"
          fill="url(#crd-face)" stroke="#888A85" stroke-width="1"/>
    <path d="M 16 32 c -4.5 -4.5 -6.5 -6.8 -6.5 -9.6 a 3.4 3.4 0 0 1
             6.5 -1.2 a 3.4 3.4 0 0 1 6.5 1.2 c 0 2.8 -2 5.1 -6.5 9.6 z"
          fill="#CC0000" stroke="#A40000" stroke-width="0.8"/>
    <path d="M 10.5 15 c -1.4 1.6 -1.2 3 0 4.2 c 1.2 -1.2 1.4 -2.6 0 -4.2 z"
          fill="#CC0000"/>
  </g>
</svg>
