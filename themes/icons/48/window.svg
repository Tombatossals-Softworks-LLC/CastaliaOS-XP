<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: window — a generic application window, the stand-in the
       Alt+Tab switcher shows for a program that publishes no icon of its own
       (§7.6, §8.4). Original artwork, Tombatossals Softworks.
       Light source: top-left. -->
  <defs>
    <linearGradient id="win-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEC"/>
    </linearGradient>
    <linearGradient id="win-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#CE5C00"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="42.5" rx="15" ry="2.2" fill="#2E3436" opacity="0.14"/>
  <rect x="5.5" y="8.5" width="37" height="31" rx="2.5"
        fill="url(#win-body)" stroke="#888A85" stroke-width="1"/>
  <path d="M 8 8.5 h 32 a 2.5 2.5 0 0 1 2.5 2.5 V 19 H 5.5 v -8
           a 2.5 2.5 0 0 1 2.5 -2.5 Z"
        fill="url(#win-bar)" stroke="#A85000" stroke-width="1"/>
  <path d="M 8 9.5 h 30 l -2 4 H 6.5 v -2 a 2 2 0 0 1 1.5 -2 Z"
        fill="#FFFFFF" opacity="0.30"/>
  <g stroke-linecap="round">
    <line x1="10" y1="14" x2="24" y2="14" stroke="#FFFFFF" stroke-width="2"
          opacity="0.85"/>
    <line x1="11" y1="26" x2="37" y2="26" stroke="#BABDB6" stroke-width="2"/>
    <line x1="11" y1="31" x2="30" y2="31" stroke="#BABDB6" stroke-width="2"/>
    <line x1="11" y1="36" x2="34" y2="36" stroke="#BABDB6" stroke-width="2"/>
  </g>
</svg>
