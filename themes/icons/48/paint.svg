<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: paint — sun-orange brushstroke, chocolate-handled brush
       (§8.4). Original artwork, Tombatossals Softworks.
       Light source: top-left. -->
  <defs>
    <linearGradient id="pnt-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
    <linearGradient id="pnt-handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9B96E"/>
      <stop offset="1" stop-color="#C17D11"/>
    </linearGradient>
  </defs>
  <rect x="7" y="9" width="26" height="30" rx="1"
        fill="#FFFFFF" stroke="#888A85" stroke-width="1"/>
  <path d="M 11 30 Q 16 18 22 24 T 29 20" fill="none"
        stroke="url(#pnt-stroke)" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="rotate(38 36 24)">
    <rect x="34" y="6" width="5" height="20" rx="2"
          fill="url(#pnt-handle)" stroke="#8F5902" stroke-width="1"/>
    <rect x="34" y="25" width="5" height="4" fill="#D3D7CF"
          stroke="#555753" stroke-width="0.8"/>
    <path d="M 34 29 h 5 l -2.5 8 Z" fill="#CE5C00"/>
  </g>
</svg>
