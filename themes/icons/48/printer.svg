  <g stroke-width="2" stroke-linecap="round">
    <line x1="17" y1="31" x2="31" y2="31" stroke="#F57900"/>
    <line x1="17" y1="35.5" x2="27" y2="35.5" stroke="#BABDB6"/>
  </g>
