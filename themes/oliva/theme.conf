# Castalia Oliva — olive & terracotta, calm and earthy (Bible §8.2).

[meta]
name = "Castalia Oliva"
id = "oliva"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#6B7F3C"              # muted olive
titlebar_top = "#6B7F3C"
titlebar_bottom = "#55672E"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#85826F"    # warm grey for the earthy family
titlebar_inactive_bottom = "#6D6A59"
titlebar_inactive_text = "#FFFFFF"
surface = "#EDE8DC"             # warm sand
surface_alt = "#E3DCCB"
text = "#201E18"
text_secondary = "#5C5748"
selection_bg = "#55672E"
selection_text = "#FFFFFF"
border = "#BFB7A2"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 2
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"

[assets]
# Per-theme desktop wallpaper (repo-relative); see themes/SCHEMA.md.
wallpaper = "branding/wallpapers/olive-dusk.svg"
