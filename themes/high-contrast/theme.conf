# Castalia High Contrast — accessibility theme (Bible §8.2, §7.11).
# Pure black/white plus one strong accent; thick focus; AAA contrast enforced.

[meta]
name = "Castalia High Contrast"
id = "high-contrast"
version = "0.1.0"
author = "Tombatossals Softworks"
high_contrast = true

[colors]
accent = "#FFD800"              # single strong accent
titlebar_top = "#000000"        # flat bar (delta 0 — trivially 16-bit safe)
titlebar_bottom = "#000000"
titlebar_text = "#FFD800"
titlebar_inactive_top = "#000000"
titlebar_inactive_bottom = "#000000"
titlebar_inactive_text = "#C8C8C8"
surface = "#000000"
surface_alt = "#101010"
text = "#FFFFFF"
text_secondary = "#C8C8C8"
selection_bg = "#FFD800"
selection_text = "#000000"
border = "#FFFFFF"

[metrics]
base_unit = 4
titlebar_height = 28            # slightly taller for legibility
corner_radius = 0               # crisp edges; no soft geometry
panel_height = 32
panel_height_800 = 30

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"
