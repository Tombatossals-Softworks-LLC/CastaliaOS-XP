# Castalia Human — the warm flagship theme (Bible §8.2 addendum).
# Story: dawn over baked earth. Chocolate titlebars, sun-orange accents and a
# paper-warm surface — the mid-2000s "human" desktop feeling, redrawn from
# scratch with Castalia's own palette. Original colors; not GNOME's Human.

[meta]
name = "Castalia Human"
id = "human"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#F57900"              # sun orange — buttons, focus, links
titlebar_top = "#5A473B"        # roasted chocolate gradient
titlebar_bottom = "#3E3028"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#8A7E74"    # warm clay haze
titlebar_inactive_bottom = "#6F655C"
titlebar_inactive_text = "#FFFFFF"
surface = "#EFEBE7"             # warm paper
surface_alt = "#E4DED4"
text = "#201A14"
text_secondary = "#6B6156"
selection_bg = "#B25000"        # deep burnt orange (AA with white text)
selection_text = "#FFFFFF"
border = "#B7AA98"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 3
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"

[assets]
# Optional per-theme desktop wallpaper (repo-relative). Themes without this
# key keep the default Azure Bay art.
wallpaper = "branding/wallpapers/valle-de-castalia.jpg"
