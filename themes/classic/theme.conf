# Castalia Classic — the default theme (Bible §8.2).
# Story: warm Mediterranean sandstone + sea azure. Original colors; not Luna.

[meta]
name = "Castalia Classic"
id = "classic"
version = "0.1.0"
author = "Tombatossals Softworks"

[colors]
accent = "#3E82B6"              # sea azure
titlebar_top = "#3E82B6"        # gradient specified in Bible §8.2
titlebar_bottom = "#2C6699"
titlebar_text = "#FFFFFF"
titlebar_inactive_top = "#7D8A94"    # neutral haze — shared inactive state
titlebar_inactive_bottom = "#66727C"
titlebar_inactive_text = "#FFFFFF"
surface = "#ECE9E4"             # warm stone-light grey
surface_alt = "#E2DED6"
text = "#1E1E1E"
text_secondary = "#5A564E"
selection_bg = "#2C6699"
selection_text = "#FFFFFF"
border = "#B8B2A6"

[metrics]
base_unit = 4
titlebar_height = 26
corner_radius = 2
panel_height = 30
panel_height_800 = 28

[fonts]
ui = "Castalia UI, DejaVu Sans"
mono = "DejaVu Sans Mono"
