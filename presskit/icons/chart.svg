       Light source: top-left. -->
  <defs>
    <linearGradient id="cht-b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D9A8"/>
      <stop offset="1" stop-color="#E9B96E"/>
    </linearGradient>
    <linearGradient id="cht-b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
    <linearGradient id="cht-b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F57900"/>
      <stop offset="1" stop-color="#CE5C00"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="36" height="36" rx="2"
