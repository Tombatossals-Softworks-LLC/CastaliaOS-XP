<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: power (Salir de Castalia) — a chocolate ring with the
       sun-orange stem, the universal "leave/turn off" reading drawn in our
       own weight (§8.4). Original artwork, Tombatossals Softworks.
       Light source: top-left. -->
  <defs>
    <linearGradient id="pwrRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5647"/>
      <stop offset="1" stop-color="#3E3028"/>
    </linearGradient>
    <linearGradient id="pwrStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="43" rx="13" ry="2" fill="#2E3436" opacity="0.14"/>
  <circle cx="24" cy="25" r="17" fill="#EFEBE7" stroke="#B7AA98"
          stroke-width="1.2"/>
  <path d="M 13.4 17.6 a 14 14 0 1 0 21.2 0" fill="none"
        stroke="url(#pwrRing)" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M 13.4 17.6 a 14 14 0 1 0 21.2 0" fill="none" stroke="#FFFFFF"
        stroke-width="1.4" stroke-linecap="round" opacity="0.28"
        transform="translate(0,-1.4)"/>
  <line x1="24" y1="9.5" x2="24" y2="24" stroke="url(#pwrStem)"
        stroke-width="5.2" stroke-linecap="round"/>
  <line x1="24" y1="11" x2="24" y2="17" stroke="#FFFFFF" stroke-width="1.4"
        stroke-linecap="round" opacity="0.45"/>
</svg>
