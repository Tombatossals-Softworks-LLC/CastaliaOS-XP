<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: settings — aluminium gear, sun-orange hub (§8.4).
       Original artwork, Tombatossals Softworks. Light source: top-left. -->
  <defs>
    <linearGradient id="set-gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#888A85"/>
      <stop offset="1" stop-color="#555753"/>
    </linearGradient>
    <linearGradient id="set-hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
  </defs>
  <g fill="url(#set-gear)">
    <rect x="21.5" y="5"  width="5" height="9" rx="1.5"/>
    <rect x="21.5" y="34" width="5" height="9" rx="1.5"/>
    <rect x="5"  y="21.5" width="9" height="5" rx="1.5"/>
    <rect x="34" y="21.5" width="9" height="5" rx="1.5"/>
    <rect x="21.5" y="5" width="5" height="9" rx="1.5"
          transform="rotate(45 24 24)"/>
    <rect x="21.5" y="34" width="5" height="9" rx="1.5"
          transform="rotate(45 24 24)"/>
    <rect x="5" y="21.5" width="9" height="5" rx="1.5"
          transform="rotate(45 24 24)"/>
    <rect x="34" y="21.5" width="9" height="5" rx="1.5"
          transform="rotate(45 24 24)"/>
  </g>
  <circle cx="24" cy="24" r="12" fill="url(#set-gear)"/>
  <circle cx="24" cy="24" r="8.5" fill="#BABDB6"/>
  <circle cx="24" cy="24" r="4.5" fill="url(#set-hub)"
          stroke="#CE5C00" stroke-width="1"/>
  <path d="M 17.5 18 a 8.5 8.5 0 0 1 8 -2.2 l -1.6 3.4 a 5 5 0 0 0 -4.4 1.4 z"
        fill="#FFFFFF" opacity="0.35"/>
</svg>
