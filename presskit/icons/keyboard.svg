<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: keyboard (Teclado en pantalla) — aluminium body with a
       sun-orange space bar (§8.4). Original artwork, Tombatossals Softworks.
       Light source: top-left. -->
  <defs>
    <linearGradient id="kb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEEEEC"/>
      <stop offset="1" stop-color="#BABDB6"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="40" rx="19" ry="2.4" fill="#2E3436" opacity="0.12"/>
  <rect x="5" y="12" width="38" height="26" rx="3"
        fill="url(#kb-body)" stroke="#555753" stroke-width="1"/>
  <rect x="7" y="14" width="34" height="4" rx="1" fill="#FFFFFF" opacity="0.35"/>
  <!-- key rows -->
  <g fill="#FFFFFF" stroke="#888A85" stroke-width="0.8">
    <rect x="8"  y="17" width="4" height="4" rx="1"/>
    <rect x="13.5" y="17" width="4" height="4" rx="1"/>
    <rect x="19" y="17" width="4" height="4" rx="1"/>
    <rect x="24.5" y="17" width="4" height="4" rx="1"/>
    <rect x="30" y="17" width="4" height="4" rx="1"/>
    <rect x="35.5" y="17" width="4" height="4" rx="1"/>
    <rect x="8"  y="23" width="4" height="4" rx="1"/>
    <rect x="13.5" y="23" width="4" height="4" rx="1"/>
    <rect x="19" y="23" width="4" height="4" rx="1"/>
    <rect x="24.5" y="23" width="4" height="4" rx="1"/>
    <rect x="30" y="23" width="4" height="4" rx="1"/>
    <rect x="35.5" y="23" width="4" height="4" rx="1"/>
  </g>
  <!-- sun-orange space bar -->
  <rect x="13" y="30.5" width="22" height="4.5" rx="1.5"
        fill="#F57900" stroke="#CE5C00" stroke-width="0.8"/>
</svg>
