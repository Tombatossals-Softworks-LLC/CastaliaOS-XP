<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: computer — CRT-era monitor, tangerine glow (§8.4).
       Original artwork, Tombatossals Softworks. Light source: top-left. -->
  <defs>
    <linearGradient id="mon-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEEEEC"/>
      <stop offset="1" stop-color="#D3D7CF"/>
    </linearGradient>
    <linearGradient id="mon-scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#CE5C00"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="42" rx="14" ry="2.4" fill="#2E3436" opacity="0.14"/>
  <rect x="7" y="7" width="34" height="26" rx="2.5"
        fill="url(#mon-body)" stroke="#888A85" stroke-width="1"/>
  <rect x="11" y="11" width="26" height="18" rx="1"
        fill="url(#mon-scr)" stroke="#555753" stroke-width="1"/>
  <path d="M 12 12 h 11 l -11 9 z" fill="#FFFFFF" opacity="0.28"/>
  <rect x="20" y="33" width="8" height="4" fill="url(#mon-body)"
        stroke="#888A85" stroke-width="1"/>
  <rect x="14" y="37" width="20" height="4" rx="1.5"
        fill="url(#mon-body)" stroke="#888A85" stroke-width="1"/>
</svg>
