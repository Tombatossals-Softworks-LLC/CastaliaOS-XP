<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: users (Cuentas de usuario) — two figures, a chocolate
       one behind and a sun-orange one in front, echoing the tango family
       (§8.4). Original artwork, Tombatossals Softworks. Light: top-left. -->
  <defs>
    <linearGradient id="usr-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </linearGradient>
    <linearGradient id="usr-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B96E"/>
      <stop offset="1" stop-color="#C17D11"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="42.5" rx="15" ry="2.4" fill="#2E3436" opacity="0.12"/>
  <!-- back figure (chocolate), upper-right, partly occluded -->
  <circle cx="31" cy="15" r="5.6" fill="url(#usr-back)"
          stroke="#8F5902" stroke-width="1"/>
  <path d="M 21 35 v -2 a 9 9 0 0 1 18 0 v 2 Z" fill="url(#usr-back)"
        stroke="#8F5902" stroke-width="1" stroke-linejoin="round"/>
  <!-- front figure (sun-orange), lower-left, drawn on top -->
  <circle cx="19" cy="18" r="6.6" fill="url(#usr-front)"
          stroke="#CE5C00" stroke-width="1"/>
  <path d="M 8 39 v -2.5 a 11 11 0 0 1 22 0 v 2.5 Z" fill="url(#usr-front)"
        stroke="#CE5C00" stroke-width="1" stroke-linejoin="round"/>
  <!-- faint top-left highlight on the front head (light source) -->
  <path d="M 14.6 15 a 6.6 6.6 0 0 1 6.4 -2.4" fill="none"
        stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"
        opacity="0.45"/>
</svg>
