<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Castalia icon: joystick (Juegos clásicos) — chocolate base, aluminium
       stick, sun-orange ball top (§8.4). Original artwork, Tombatossals
       Softworks. Light source: top-left. -->
  <defs>
    <linearGradient id="joy-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A473B"/>
      <stop offset="1" stop-color="#3E3028"/>
    </linearGradient>
    <linearGradient id="joy-stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEEEEC"/>
      <stop offset="0.5" stop-color="#BABDB6"/>
      <stop offset="1" stop-color="#888A85"/>
    </linearGradient>
    <radialGradient id="joy-ball" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#FCAF3E"/>
      <stop offset="1" stop-color="#F57900"/>
    </radialGradient>
  </defs>
  <ellipse cx="24" cy="42" rx="15" ry="2.6" fill="#2E3436" opacity="0.16"/>
  <!-- base -->
  <path d="M 9 40 a 2 2 0 0 1 -2 -2 v -6 a 3 3 0 0 1 3 -3 h 28 a 3 3 0 0 1 3 3
           v 6 a 2 2 0 0 1 -2 2 z"
        fill="url(#joy-base)" stroke="#2E3436" stroke-width="1"/>
  <rect x="10" y="30" width="28" height="3" rx="1.5" fill="#FFFFFF" opacity="0.08"/>
  <!-- red action button on the base -->
  <circle cx="34" cy="35.5" r="3" fill="#CC0000" stroke="#A40000" stroke-width="1"/>
  <!-- stick -->
  <rect x="21.5" y="14" width="5" height="18" rx="2.5"
        fill="url(#joy-stick)" stroke="#555753" stroke-width="1"/>
  <!-- ball top -->
  <circle cx="24" cy="11" r="7.5" fill="url(#joy-ball)"
          stroke="#CE5C00" stroke-width="1"/>
  <path d="M 18.5 8 a 7.5 7.5 0 0 1 8 -3.2 l -1.4 3 a 4 4 0 0 0 -4 1.6 z"
        fill="#FFFFFF" opacity="0.45"/>
</svg>
