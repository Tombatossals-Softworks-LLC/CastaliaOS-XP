<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    Castalia mark v0.2 — the "C monogram keep" (Project Bible §21.2).

    A stylised letter C drawn as a thick azure ring, open to the right, with
    the Castalia keep standing inside it on green hills: a crenellated main
    tower, two conical-roofed turrets, warm lit windows and an arched door.

    Geometry only — no fonts, no rasters, no filters — on the 48-unit grid the
    icon family uses, so one file serves a 16 px tray icon and a 1024 px press
    render. Centre (24,24); the C's outer radius is 22.6, its inner 13.4, and
    its arms are cut radially at ±35° from the horizontal.

    Everything that sits "inside" the badge is bounded by arcs of that same
    outer circle rather than by a clip path: Qt 5's QSvgRenderer — which is
    what actually paints this file across the shell — ignores <clipPath>, and
    a mark that only looks right in a browser is no use to us.

    Original artwork by Tombatossals Softworks — NOT derived from any
    Microsoft asset. License: legal/ASSET_PROVENANCE.csv.
  -->
  <defs>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5AA0DC"/>
      <stop offset="0.55" stop-color="#3B7CC4"/>
      <stop offset="1" stop-color="#2A5FA0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87BEEC"/>
      <stop offset="0.45" stop-color="#5A98D6"/>
      <stop offset="1" stop-color="#3A72B4"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A98D6"/>
      <stop offset="1" stop-color="#2F5F9B"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F26A52"/>
      <stop offset="1" stop-color="#C9281C"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ECC57"/>
      <stop offset="1" stop-color="#5DA634"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FBC41"/>
      <stop offset="1" stop-color="#3D8724"/>
    </linearGradient>
  </defs>

  <!-- ── the C: a thick ring with a 70° bite out of the right side ──────── -->
  <path d="M 42.52 11.04
           A 22.6 22.6 0 1 0 42.52 36.96
           L 34.98 31.69
           A 13.4 13.4 0 1 1 34.98 16.31 Z"
        fill="url(#ring)" stroke="#0E2C4E" stroke-width="1.7"
        stroke-linejoin="round"/>

  <!-- ── the keep, standing in the bowl of the C ────────────────────────── -->
  <g transform="translate(2.9 1.7) scale(0.9)">
    <!-- left turret: conical roof over a slim tower -->
    <g stroke="#0E2C4E" stroke-width="1.5" stroke-linejoin="round">
      <rect x="9.6" y="15" width="6.8" height="21" fill="url(#stoneDark)"/>
      <path d="M 13 5.6 L 17.8 15.6 L 8.2 15.6 Z" fill="url(#roof)"/>
    </g>
    <path d="M 11.4 21.8 a 1.6 1.6 0 0 1 3.2 0 L 14.6 26.6 L 11.4 26.6 Z"
          fill="#FFB020" stroke="#0E2C4E" stroke-width="1"/>

    <!-- main keep: crenellated tower, lit window, arched door -->
    <g stroke="#0E2C4E" stroke-width="1.5" stroke-linejoin="round">
      <rect x="15.2" y="10" width="11.2" height="26" fill="url(#stone)"/>
      <rect x="15.2" y="6.4" width="3" height="4.4" fill="url(#stone)"/>
      <rect x="19.3" y="6.4" width="3" height="4.4" fill="url(#stone)"/>
      <rect x="23.4" y="6.4" width="3" height="4.4" fill="url(#stone)"/>
    </g>
    <path d="M 18.7 14 a 2.1 2.1 0 0 1 4.2 0 L 22.9 19.4 L 18.7 19.4 Z"
          fill="#FFB020" stroke="#0E2C4E" stroke-width="1"/>
    <path d="M 17.8 36 L 17.8 27.4 a 3 3 0 0 1 6 0 L 23.8 36 Z"
          fill="#F79300" stroke="#0E2C4E" stroke-width="1.3"/>
    <path d="M 19.3 36 L 19.3 28 a 1.5 1.5 0 0 1 3 0 L 22.3 36 Z"
          fill="#FFD27A" opacity="0.85"/>

    <!-- right turret: the smaller cone, set back on the ridge -->
    <g stroke="#0E2C4E" stroke-width="1.5" stroke-linejoin="round">
      <rect x="26.2" y="22" width="5.8" height="14" fill="url(#stoneDark)"/>
      <path d="M 29.1 14 L 33.4 22.6 L 24.8 22.6 Z" fill="url(#roof)"/>
    </g>
    <path d="M 27.7 27.4 a 1.4 1.4 0 0 1 2.8 0 L 30.5 31.6 L 27.7 31.6 Z"
          fill="#FFB020" stroke="#0E2C4E" stroke-width="1"/>

    <!-- the lit edge of the keep -->
    <path d="M 16.5 11 L 16.5 35" fill="none" stroke="#D6EAFF"
          stroke-width="1.1" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- ── the hills: each ends ON the badge circle and returns along it ──── -->
  <path d="M 2.58 31.2 Q 13 26.6 24 30.4 Q 35 34.2 45.79 30
           A 22.6 22.6 0 0 1 2.58 31.2 Z"
        fill="url(#hillBack)" stroke="#20571A" stroke-width="1.3"
        stroke-linejoin="round"/>
  <path d="M 4.15 34.8 Q 14 30.4 26 34.4 Q 38 38.4 44.17 34.2
           A 22.6 22.6 0 0 1 4.15 34.8 Z"
        fill="url(#hillFront)" stroke="#20571A" stroke-width="1.3"
        stroke-linejoin="round"/>
</svg>
