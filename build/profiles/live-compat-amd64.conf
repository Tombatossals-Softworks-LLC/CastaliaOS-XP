# Castalia edition profile: live-compat-amd64 — the Phase 6 (Wine) proof.
# The graphical desktop PLUS Wine, booting to the desktop where a real,
# original Win32 .exe runs under Wine.
LABEL="Castalia Live Compat (amd64 · Wine)"
ARCH="amd64"
SUITE="bookworm"
MIRROR="http://deb.debian.org/debian"
PACKAGES="linux-image-amd64 live-boot sysvinit-core udev kmod util-linux xserver-xorg xserver-xorg-legacy xinit openbox x11-xserver-utils libqt5widgets5 libqt5svg5 libqt5gui5 qtbase5-dev-tools libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 fonts-dejavu-core dbus-x11 wine wine64 python3 parted e2fsprogs dosfstools rsync grub-pc os-prober pciutils iputils-ping libarchive-tools"
COMPRESSION="gzip"
# VERSION is not a directory but it must travel with the source:
# shell/CMakeLists.txt reads ../VERSION and a chroot without it cannot
# configure at all — which is how a "desktop" ISO shipped with no shell.
SRC_DIRS="shell apps iso themes branding services tools compat i18n installer recovery VERSION"
HOOK="build/hooks/desktop-amd64.sh"
# Ships castalia-instalador + the text installer, so the boot menu gets
# its "Instalar Castalia OS" entries (build/mkiso.sh, §14.1).
INSTALLER="yes"
