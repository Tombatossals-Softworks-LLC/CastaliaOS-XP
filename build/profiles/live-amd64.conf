# Castalia edition profile: live-amd64 — a lean, genuinely bootable live
# image used to prove the Phase 1 ISO pipeline end to end in QEMU.
# Minimal by design: kernel + live-boot + SysVinit (the §6.4 fallback init,
# turnkey for a first-boot proof) + the tools live-boot needs.
LABEL="Castalia Live (amd64 boot proof)"
ARCH="amd64"
SUITE="bookworm"
MIRROR="http://deb.debian.org/debian"
PACKAGES="linux-image-amd64 live-boot sysvinit-core udev kmod util-linux"
COMPRESSION="gzip"
