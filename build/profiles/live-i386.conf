# Castalia edition profile: live-i386 — the 32-bit twin of live-amd64.
#
# Same lean shape and the same job: prove the ISO pipeline end to end, in
# QEMU, for the architecture the product is actually about. §4.1 and §16 both
# put the FLOOR at a Pentium 4, which is 32-bit; every ISO built until now was
# amd64, so the arch the promise is made about was the one nothing built.
#
# linux-image-686-pae is the only 686 flavour bookworm still ships — the
# non-PAE one was dropped — and it is fine for the target hardware: a Pentium
# 4 has PAE. The boot gate runs it under `qemu-system-i386 -cpu coreduo`, a
# 32-bit-only CPU model, so a kernel or userland that quietly needed 64-bit
# fails there rather than passing on an amd64 emulator that would have run it.
LABEL="Castalia Live (i386 boot proof)"
ARCH="i386"
SUITE="bookworm"
MIRROR="http://deb.debian.org/debian"
PACKAGES="linux-image-686-pae live-boot sysvinit-core udev kmod util-linux"
COMPRESSION="gzip"
