# Castalia OS — nightly pipeline (Project Bible §17.4).
#
# The heavy suite that is too slow for per-commit CI: REAL ISO builds for the
# bootable editions, QEMU boot + framebuffer proofs at the FLOOR tier, the
# installer's full install-to-disk-then-boot exercise, and a fresh
# .deb + apt-repo distribution build. Artifacts are kept for a week so any
# nightly regression ships with its evidence.
#
# Also runnable on demand (workflow_dispatch).

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC daily
  workflow_dispatch:

# One nightly at a time: a manual dispatch on top of a still-running scheduled
# run would otherwise have two ISO builds competing for the same runners.
concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  iso-live:
    name: live-amd64 ISO — build + FLOOR boot (Bible §18 P1, §19.1)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ISO + boot toolchain
        run: |
          sh ci/apt-install.sh \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            qemu-system-x86 python3

      - name: Build the live-amd64 ISO
        run: sudo sh build/mkiso.sh --edition live-amd64

      - name: Boot it headless in QEMU and assert userspace (FLOOR tier)
        run: |
          sh tests/qemu/boot-smoke.sh \
            build/out/iso/castalia-live-amd64.iso --timeout 300

      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: castalia-live-amd64-iso
          path: build/out/iso/castalia-live-amd64.iso
          retention-days: 7

  iso-classic32:
    name: classic32 ISO — the 32-bit edition, built (Bible §18 P1, §4.1)
    # §18 Phase 1's deliverable is "castalia-min ISO (classic32 + classic64)".
    # classic32 has existed as a profile since the roadmap was written and had
    # never been built, so nothing knew whether its package set even resolves
    # on i386 — which is the question this answers, nightly, before somebody
    # finds out during a release.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ISO + boot toolchain
        run: |
          sh ci/apt-install.sh \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            qemu-system-x86 python3

      - name: Build the classic32 ISO
        run: sudo sh build/mkiso.sh --edition classic32

      - name: Boot it on a CPU that cannot run 64-bit code
        # classic32 boots to runit + LightDM rather than to a serial getty,
        # so the marker is what a graphical edition can honestly show over a
        # serial line: the kernel reached userspace and init took over.
        run: |
          sh tests/qemu/boot-smoke.sh \
            build/out/iso/castalia-classic32.iso \
            --qemu qemu-system-i386 --cpu coreduo \
            --mem 512 --timeout 420 \
            --marker 'runit: enter stage|Castalia|castalia login:|systemd-udevd|Starting'

      - name: Upload the ISO
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: castalia-classic32-iso
          path: build/out/iso/castalia-classic32.iso
          if-no-files-found: warn
          retention-days: 7

  iso-live-i386:
    name: live-i386 ISO — build + FLOOR boot on a 32-bit CPU (§4.1, §16)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ISO + boot toolchain
        run: |
          sh ci/apt-install.sh \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            qemu-system-x86 python3

      - name: Build the live-i386 ISO
        run: sudo sh build/mkiso.sh --edition live-i386

      - name: Boot it on a CPU that cannot run 64-bit code
        run: |
          sh tests/qemu/boot-smoke.sh \
            build/out/iso/castalia-live-i386.iso \
            --qemu qemu-system-i386 --cpu coreduo --timeout 300

      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: castalia-live-i386-iso
          path: build/out/iso/castalia-live-i386.iso
          retention-days: 7

  iso-desktop:
    name: live-desktop-amd64 ISO — build + desktop proof (Bible §18 P2)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install ISO + boot toolchain
        run: |
          sh ci/apt-install.sh \
            debootstrap squashfs-tools xorriso isolinux syslinux-common \
            qemu-system-x86 python3

      - name: Build the live-desktop ISO (Xorg + Openbox + Castalia shell)
        run: sudo sh build/mkiso.sh --edition live-desktop-amd64

      - name: Boot it and capture the desktop framebuffer
        run: |
          python3 tests/qemu/screenshot.py \
            build/out/iso/castalia-live-desktop-amd64.iso \
            --out castalia-desktop-live.png --wait 180 --mem 768
          test -s castalia-desktop-live.png

      - name: Upload the ISO + desktop proof
        # A failed boot is exactly when the serial log is worth having, so this
        # runs even when the capture step failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: castalia-live-desktop-amd64
          path: |
            build/out/iso/castalia-live-desktop-amd64.iso
            castalia-desktop-live.png
            castalia-desktop-live.serial.log
          if-no-files-found: warn
          retention-days: 7

  installer-endtoend:
    name: Installer — install to disk + boot the result (Bible §14)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install install + boot toolchain
        run: |
          sh ci/apt-install.sh \
            debootstrap parted e2fsprogs rsync util-linux \
            qemu-system-x86 python3

      - name: Install to a disk with castalia-install, then boot it
        run: |
          sudo modprobe loop || true
          sudo sh installer/tests/qemu-install.sh --timeout 480

  dist:
    name: Distribution — nightly .deb + apt overlay repo (Bible §13, §17.2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Qt5 + packaging toolchain
        run: |
          sh ci/apt-install.sh \
            qtbase5-dev libqt5svg5-dev libxcb1-dev cmake g++ \
            fonts-dejavu-core dpkg-dev qttools5-dev-tools

      - name: Build shell + .deb + repo (nightly-stamped version)
        run: |
          PYTHONPATH=tools python3 tools/theme_export.py
          python3 tools/i18n_build.py release
          cmake -S shell -B build/out/shell-build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/out/shell-build -j4
          VER="$(tr -d ' \n' < VERSION)~nightly$(date -u +%Y%m%d)"
          sh packages/mkdeb.sh --version "$VER"
          sh build/mkrepo.sh

      - name: Upload the nightly repo
        uses: actions/upload-artifact@v7
        with:
          name: castalia-nightly-repo
          path: build/out/repo/
          retention-days: 7
