<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
  <!--
    Castalia wallpaper: "Marine Deep" (the Azul theme's desktop).
    A cool marine bay after sunset — deep saturated blues, a pale horizon and
    the Castalia keep on the headland. Original artwork by Tombatossals
    Softworks; no third-party asset referenced. Raster sizes baked from source.
  -->
  <defs>
    <linearGradient id="md-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#123A63"/>
      <stop offset="0.6"  stop-color="#2F6FB2"/>
      <stop offset="1"    stop-color="#9FC4E2"/>
    </linearGradient>
    <linearGradient id="md-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2F6FB2"/>
      <stop offset="0.4"  stop-color="#1F5590"/>
      <stop offset="1"    stop-color="#0E2E4E"/>
    </linearGradient>
    <radialGradient id="md-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#DCEBF7" stop-opacity="0.8"/>
      <stop offset="1"   stop-color="#DCEBF7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="500" fill="url(#md-sky)"/>
  <circle cx="512" cy="470" r="150" fill="url(#md-glow)"/>
  <rect x="0" y="500" width="1024" height="268" fill="url(#md-sea)"/>
  <g fill="#DCEBF7">
    <ellipse cx="512" cy="516" rx="60" ry="3.5" opacity="0.45"/>
    <ellipse cx="500" cy="536" rx="44" ry="3"   opacity="0.34"/>
    <ellipse cx="522" cy="560" rx="52" ry="3"   opacity="0.24"/>
    <ellipse cx="506" cy="592" rx="34" ry="2.5" opacity="0.16"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 0 548 Q 128 541 256 548 T 512 548 T 768 548 T 1024 548" opacity="0.08"/>
    <path d="M 0 616 Q 170 608 340 616 T 680 616 T 1024 616" opacity="0.06"/>
  </g>
  <!-- headland with the keep -->
  <g fill="#0C2138">
    <path d="M 0 500 L 0 405 Q 60 392 110 402 Q 175 415 232 452
             Q 268 476 300 500 Z"/>
    <rect x="96" y="330" width="46" height="76"/>
    <rect x="96" y="318" width="10" height="14"/>
    <rect x="114" y="318" width="10" height="14"/>
    <rect x="132" y="318" width="10" height="14"/>
    <rect x="142" y="372" width="52" height="36"/>
    <rect x="142" y="362" width="8" height="12"/>
    <rect x="158" y="362" width="8" height="12"/>
    <rect x="174" y="362" width="8" height="12"/>
    <rect x="186" y="362" width="8" height="12"/>
  </g>
  <rect x="115" y="352" width="7" height="11" fill="#BFE0F5" opacity="0.9"/>
  <path d="M 1024 500 L 1024 452 Q 950 440 880 458 Q 830 472 790 500 Z"
        fill="#274E70" opacity="0.55"/>
</svg>
