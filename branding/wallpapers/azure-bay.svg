<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
  <!--
    Castalia wallpaper: "Azure Bay" (Project Bible §21.3).
    A quiet Mediterranean bay at golden hour with the Castalia keep on the
    headland. Original artwork by Tombatossals Softworks — no Microsoft
    asset referenced. Shipped raster sizes are baked from this source.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2E6FA3"/>
      <stop offset="0.55" stop-color="#8FBEDD"/>
      <stop offset="0.98" stop-color="#F0E2C6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7FB0D4"/>
      <stop offset="0.35" stop-color="#3E82B6"/>
      <stop offset="1"    stop-color="#24567F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFF2D0" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFE9B8" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#FFE9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1024" height="500" fill="url(#sky)"/>

  <!-- sun + glow, low over the water -->
  <circle cx="700" cy="440" r="150" fill="url(#glow)"/>
  <circle cx="700" cy="440" r="34" fill="#FBEED2"/>

  <!-- sea -->
  <rect x="0" y="500" width="1024" height="268" fill="url(#sea)"/>

  <!-- sun glitter path on the water -->
  <g fill="#FFF2D0">
    <ellipse cx="700" cy="512" rx="60" ry="3.5" opacity="0.55"/>
    <ellipse cx="688" cy="530" rx="44" ry="3"   opacity="0.42"/>
    <ellipse cx="712" cy="552" rx="52" ry="3"   opacity="0.32"/>
    <ellipse cx="694" cy="580" rx="36" ry="2.5" opacity="0.24"/>
    <ellipse cx="706" cy="616" rx="46" ry="2.5" opacity="0.16"/>
    <ellipse cx="698" cy="660" rx="30" ry="2"   opacity="0.10"/>
  </g>

  <!-- quiet swell lines -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 0 545 Q 128 538 256 545 T 512 545 T 768 545 T 1024 545" opacity="0.10"/>
    <path d="M 0 610 Q 170 602 340 610 T 680 610 T 1024 610" opacity="0.08"/>
    <path d="M 0 690 Q 200 682 400 690 T 800 690 T 1024 690" opacity="0.06"/>
  </g>

  <!-- headland with the Castalia keep, silhouetted against the warm horizon -->
  <g fill="#3B4A36">
    <path d="M 0 500 L 0 405 Q 60 392 110 402 Q 175 415 232 452
             Q 268 476 300 500 Z"/>
  </g>
  <g fill="#333F2F">
    <!-- keep tower on the ridge: body + three merlons + arched door glow -->
    <rect x="96" y="330" width="46" height="76"/>
    <rect x="96" y="318" width="10" height="14"/>
    <rect x="114" y="318" width="10" height="14"/>
    <rect x="132" y="318" width="10" height="14"/>
    <!-- lower bailey wall -->
    <rect x="142" y="372" width="52" height="36"/>
    <rect x="142" y="362" width="8" height="12"/>
    <rect x="158" y="362" width="8" height="12"/>
    <rect x="174" y="362" width="8" height="12"/>
    <rect x="186" y="362" width="8" height="12"/>
  </g>
  <!-- a single warm lit window in the keep -->
  <rect x="115" y="352" width="7" height="11" fill="#F5D9A0" opacity="0.9"/>

  <!-- far headland on the right, hazier -->
  <path d="M 1024 500 L 1024 452 Q 950 440 880 458 Q 830 472 790 500 Z"
        fill="#4A5C6B" opacity="0.55"/>
</svg>
