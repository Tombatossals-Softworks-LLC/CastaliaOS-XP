<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
  <!--
    Castalia wallpaper: "Olive Dusk" (the Oliva theme's desktop).
    Rolling olive hills under a warm sand-and-terracotta dusk, with the
    Castalia keep on the near ridge. Original artwork by Tombatossals
    Softworks; no third-party asset referenced. Raster sizes baked from source.
  -->
  <defs>
    <linearGradient id="od-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8C7A3A"/>
      <stop offset="0.5"  stop-color="#C9A96B"/>
      <stop offset="1"    stop-color="#EDE0C2"/>
    </linearGradient>
    <linearGradient id="od-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8B4E"/><stop offset="1" stop-color="#6B7F3C"/>
    </linearGradient>
    <linearGradient id="od-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6B31"/><stop offset="1" stop-color="#404D22"/>
    </linearGradient>
    <radialGradient id="od-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBEFD0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FBEFD0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="768" fill="url(#od-sky)"/>
  <circle cx="740" cy="300" r="150" fill="url(#od-sun)"/>
  <circle cx="740" cy="300" r="30" fill="#FBEED2"/>
  <!-- far olive ridge -->
  <path d="M 0 470 Q 260 420 520 452 Q 780 484 1024 440 L 1024 768 L 0 768 Z"
        fill="url(#od-far)"/>
  <!-- near olive ridge -->
  <path d="M 0 560 Q 300 512 560 556 Q 800 596 1024 548 L 1024 768 L 0 768 Z"
        fill="url(#od-near)"/>
  <!-- rows of olive trees on the near ridge (dots) -->
  <g fill="#33401B" opacity="0.8">
    <circle cx="120" cy="590" r="7"/><circle cx="180" cy="600" r="6"/>
    <circle cx="250" cy="592" r="7"/><circle cx="330" cy="604" r="6"/>
    <circle cx="620" cy="600" r="7"/><circle cx="700" cy="592" r="6"/>
    <circle cx="780" cy="602" r="7"/><circle cx="880" cy="596" r="6"/>
  </g>
  <!-- the keep on the near ridge -->
  <g fill="#2C3617">
    <rect x="452" y="470" width="42" height="70"/>
    <rect x="452" y="460" width="9" height="12"/>
    <rect x="465" y="460" width="9" height="12"/>
    <rect x="478" y="460" width="9" height="12"/>
    <rect x="494" y="504" width="40" height="36"/>
  </g>
  <rect x="468" y="490" width="6" height="9" fill="#F5D9A0" opacity="0.9"/>
</svg>
