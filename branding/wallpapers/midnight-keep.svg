<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
  <!--
    Castalia wallpaper: "Midnight Keep" (the Medianoche dark theme's desktop).
    A graphite night sky with a quiet sky-blue aurora glow over the bay and the
    Castalia keep. Tuned to the Medianoche palette. Original artwork by
    Tombatossals Softworks; no third-party asset referenced.
  -->
  <defs>
    <linearGradient id="mk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#181C22"/>
      <stop offset="0.6"  stop-color="#23272E"/>
      <stop offset="1"    stop-color="#2C3540"/>
    </linearGradient>
    <linearGradient id="mk-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26303B"/><stop offset="1" stop-color="#141920"/>
    </linearGradient>
    <radialGradient id="mk-aurora" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0"   stop-color="#4C9BE0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#2F6FB2" stop-opacity="0.2"/>
      <stop offset="1"   stop-color="#2F6FB2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="500" fill="url(#mk-sky)"/>
  <!-- stars -->
  <g fill="#C7D6E6">
    <circle cx="120" cy="90" r="1.4" opacity="0.9"/><circle cx="240" cy="150" r="1" opacity="0.6"/>
    <circle cx="360" cy="70" r="1.2" opacity="0.8"/><circle cx="500" cy="130" r="1" opacity="0.5"/>
    <circle cx="640" cy="80" r="1.5" opacity="0.9"/><circle cx="760" cy="160" r="1" opacity="0.6"/>
    <circle cx="880" cy="100" r="1.3" opacity="0.8"/><circle cx="940" cy="200" r="1" opacity="0.5"/>
    <circle cx="180" cy="220" r="1" opacity="0.5"/><circle cx="420" cy="230" r="1.2" opacity="0.7"/>
    <circle cx="700" cy="240" r="1" opacity="0.5"/><circle cx="560" cy="60" r="1" opacity="0.6"/>
  </g>
  <!-- aurora glow low over the water -->
  <ellipse cx="512" cy="470" rx="360" ry="150" fill="url(#mk-aurora)"/>
  <rect x="0" y="500" width="1024" height="268" fill="url(#mk-sea)"/>
  <!-- glimmer -->
  <g fill="#4C9BE0">
    <ellipse cx="512" cy="520" rx="54" ry="3" opacity="0.4"/>
    <ellipse cx="500" cy="548" rx="40" ry="2.5" opacity="0.28"/>
    <ellipse cx="520" cy="580" rx="46" ry="2.5" opacity="0.18"/>
  </g>
  <!-- headland with the keep, one warm window against the dark -->
  <g fill="#0C0F14">
    <path d="M 0 500 L 0 405 Q 60 392 110 402 Q 175 415 232 452
             Q 268 476 300 500 Z"/>
    <rect x="96" y="330" width="46" height="76"/>
    <rect x="96" y="318" width="10" height="14"/>
    <rect x="114" y="318" width="10" height="14"/>
    <rect x="132" y="318" width="10" height="14"/>
    <rect x="142" y="372" width="52" height="36"/>
    <rect x="142" y="362" width="8" height="12"/>
    <rect x="158" y="362" width="8" height="12"/>
    <rect x="174" y="362" width="8" height="12"/>
    <rect x="186" y="362" width="8" height="12"/>
  </g>
  <rect x="115" y="352" width="7" height="11" fill="#FCAF3E" opacity="0.95"/>
</svg>
