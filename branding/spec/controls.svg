<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <!--
    Castalia window-control geometry specification (Project Bible §8.3).
    Original artwork by Tombatossals Softworks — NOT derived from any
    Microsoft asset. License: see legal/ASSET_PROVENANCE.csv.

    Buttons are 20×20 px with a 2 px corner radius; glyphs sit on a 16 px
    inner grid with 2 px stroke weight. Close is accent-tinted; minimize and
    maximize are neutral. Shown here at 4× with the real-size row below.
  -->
  <style>
    .label { font-family: sans-serif; font-size: 10px; fill: #5A564E; }
    .title { font-family: sans-serif; font-size: 12px; fill: #1E1E1E; font-weight: bold; }
  </style>

  <rect width="360" height="200" fill="#ECE9E4"/>
  <text x="16" y="22" class="title">Castalia window controls — geometry spec (4×)</text>

  <!-- ======== 4× enlarged buttons (80×80 = 20 px @ 4×) ======== -->
  <!-- Minimize: neutral button, bar at glyph baseline (y=13, 10×2 @1×) -->
  <g transform="translate(24,40)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#E2DED6" stroke="#B8B2A6" stroke-width="4"/>
    <rect x="20" y="52" width="40" height="8" fill="#1E1E1E"/>
  </g>
  <text x="64" y="140" class="label" text-anchor="middle">minimize</text>

  <!-- Maximize: neutral button, 10×10 square outline @1×, 2 px stroke -->
  <g transform="translate(128,40)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#E2DED6" stroke="#B8B2A6" stroke-width="4"/>
    <rect x="24" y="24" width="32" height="32" fill="none" stroke="#1E1E1E" stroke-width="8"/>
  </g>
  <text x="168" y="140" class="label" text-anchor="middle">maximize</text>

  <!-- Close: accent-tinted button, X glyph 8×8 @1×, 2 px stroke, white -->
  <g transform="translate(232,40)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#3E82B6" stroke="#2C6699" stroke-width="4"/>
    <path d="M 26 26 L 54 54 M 54 26 L 26 54" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="272" y="140" class="label" text-anchor="middle">close (accent-tinted)</text>

  <!-- ======== real-size row (1×: 20×20, 2 px radius) ======== -->
  <text x="16" y="170" class="label">1× :</text>
  <g transform="translate(48,156)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#E2DED6" stroke="#B8B2A6" stroke-width="1"/>
    <rect x="5" y="13" width="10" height="2" fill="#1E1E1E"/>
  </g>
  <g transform="translate(76,156)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#E2DED6" stroke="#B8B2A6" stroke-width="1"/>
    <rect x="6" y="6" width="8" height="8" fill="none" stroke="#1E1E1E" stroke-width="2"/>
  </g>
  <g transform="translate(104,156)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#3E82B6" stroke="#2C6699" stroke-width="1"/>
    <path d="M 6.5 6.5 L 13.5 13.5 M 13.5 6.5 L 6.5 13.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <text x="140" y="170" class="label">20×20 px · r=2 · glyph grid 16 px · stroke 2 px</text>
</svg>
