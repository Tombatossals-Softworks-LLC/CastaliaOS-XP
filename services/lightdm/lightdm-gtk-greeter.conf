# Castalia greeter appearance (Bible §6.6, §8.6) — the dawn threshold.
#
# Installed to /etc/lightdm/lightdm-gtk-greeter.conf by castalia-desktop.
# The full greeter specification (states, choreography, budgets) lives in
# branding/login/README.md; this file wires the stock GTK greeter to the
# Castalia Human look until the native token-driven greeter lands:
#   * background   — the shipped default wallpaper (the keep on the
#                    green hills), so the greeter and the desktop match
#   * identity     — branding/login/banner.svg is the reference plate the
#                    native greeter will draw; the GTK greeter approximates
#                    it with the wallpaper + clock panel below
#   * keyboard-first, no user enumeration surprises (Bible §15)

[greeter]
background = /usr/share/castalia/branding/wallpapers/valle-de-castalia.jpg
user-background = false
font-name = DejaVu Sans 10
xft-antialias = true
xft-hintstyle = hintslight
icon-theme-name = Castalia
indicators = ~spacer;~clock;~spacer;~power
clock-format = %H:%M · %A, %e de %B
position = 50%,center 55%,center
panel-position = bottom
hide-user-image = false
