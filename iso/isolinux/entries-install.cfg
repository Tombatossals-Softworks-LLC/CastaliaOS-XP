# The install entries, spliced into the INSTALL placeholder for every
# edition whose profile sets INSTALLER="yes". Both boot the ordinary live
# system and hand it castalia.installer=<mode> on the kernel command line;
# /usr/local/bin/castalia-live-session reads it out of /proc/cmdline.
#
# "gui" is the normal path: the live desktop comes up and the graphical
# installer opens on top of it, so the machine you are about to install onto
# is one you have already seen working. "text" is the §14.5 #5 fallback for a
# machine whose graphics never come up at all.

LABEL install
    MENU LABEL ^Instalar Castalia OS en el disco
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img @APPEND@ castalia.installer=gui quiet

LABEL textinstall
    MENU LABEL Instalar en modo ^texto (sin graficos)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img @APPEND@ castalia.installer=text
