# Castalia OS — installed-system GRUB menu (Bible §6.2).
# Fixed, human-readable entries: normal boot, Safe Mode, Recovery, memtest.
# Kernel/initrd paths are templated by the installer (@ROOT_UUID@ etc.);
# the N-1 kernel entry is appended by the update pipeline (§13.3).

set default="${saved_entry}"
set timeout=4
set timeout_style=menu

loadfont /boot/grub/fonts/dejavu_14.pf2
loadfont /boot/grub/fonts/dejavu_12.pf2
loadfont /boot/grub/fonts/dejavu_20b.pf2
set gfxmode=1024x768,800x600,640x480,auto
set gfxpayload=keep
insmod gfxterm
insmod png
terminal_output gfxterm
set theme=/boot/grub/theme/theme.txt

menuentry "Castalia Classic" --id castalia {
    search --no-floppy --fs-uuid --set=root @ROOT_UUID@
    linux  /boot/vmlinuz root=UUID=@ROOT_UUID@ ro quiet splash
    initrd /boot/initrd.img
}

menuentry "Castalia Classic — Modo seguro (Safe Mode)" --id castalia-safe {
    search --no-floppy --fs-uuid --set=root @ROOT_UUID@
    # §6.2: no compositor, generic video, minimal services, single core
    linux  /boot/vmlinuz root=UUID=@ROOT_UUID@ ro nomodeset maxcpus=1 \
           castalia.safemode=1
    initrd /boot/initrd.img
}

menuentry "Castalia — Recuperación (Recovery)" --id castalia-recovery {
    search --no-floppy --fs-uuid --set=root @ROOT_UUID@
    # boots the self-contained recovery initramfs (§6.13) — independent of
    # the installed root's health
    linux  /boot/vmlinuz-recovery castalia.recovery=1
    initrd /boot/initrd-recovery.img
}

menuentry "Test de memoria (memtest86+)" --id memtest {
    search --no-floppy --fs-uuid --set=root @ROOT_UUID@
    linux16 /boot/memtest86+.bin
}

# remember the last-booted entry (§6.2)
if [ "${grub_platform}" = "pc" ]; then
    insmod part_msdos
fi
savedefault
